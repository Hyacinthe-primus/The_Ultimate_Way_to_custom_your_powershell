name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-pwsh:
    name: Validate (pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static checks
        shell: pwsh
        run: ./.github/scripts/validate.ps1

  validate-windows-powershell:
    name: Validate (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run static checks
        shell: powershell
        run: ./.github/scripts/validate.ps1
